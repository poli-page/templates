# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config for poli-page repos. PRs here are mostly opened and fixed by automated agents
# (the poli-page auto loop and issue pipeline), which read CodeRabbit's findings and its commit status.
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  allow_author_approval: true
  # The summary goes in the walkthrough, never in the PR description: the merge gate reads the description.
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: false
  # The loop decides "reviewed this head" from the CodeRabbit commit status ("Review completed").
  review_progress: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  # PR labels are the closed issues' labels; CodeRabbit only suggests.
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  disable_cache: false
  slop_detection:
    enabled: true
    include_all_authors: false
  auto_review:
    enabled: true
    drafts: false
    # Every push of a fix round must be reviewed, and never auto-paused (the loop allows up to 5 rounds).
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    - "!index.json"
    - "!**/templates/*/manifest.json"
    - "!**/assets/fonts/**"
    - "!**/output/**"
  path_instructions:
    - path: "**/templates/**/*.html"
      instructions: >-
        Templates are rendered by the Poli Page engine. Check that poli classes and meta-variables
        are used as defined in the poli-page spec (poli-classes-and-meta-variables.md), that Handlebars
        expressions reference fields present in the sibling sample data JSON, and that styling relies
        on the collection's tailwind.css and bundled assets rather than external URLs.
    - path: "**/templates/**/*.json"
      instructions: >-
        The sample data file must stay in sync with the fields the sibling HTML template reads. Flag
        missing or renamed keys, and keep the data realistic, non-sensitive and valid JSON.
    - path: "**/poli-page.json"
      instructions: >-
        Collection config. Template, font and asset paths must resolve to files in the collection,
        and any new template must also be registered in tools/build-template-manifests.mjs.
    - path: "tools/**/*.mjs"
      instructions: >-
        index.json and per-template manifest.json files are generated by this script. Flag manual
        edits to generated files that the script would not reproduce, and keep the script idempotent
        (it must not overwrite manual refines without --force).
    - path: "**/tailwind*.css"
      instructions: >-
        Keep tokens and fonts consistent with the collection's poli-page.json and assets; per-template
        tailwind-additions.css should only contain tokens that template actually uses.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns: []      # per repo
