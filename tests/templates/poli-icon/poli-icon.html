<div class="bg-white text-gray-800 text-sm font-sans px-10 pt-8 pb-4 flex flex-col gap-4 w-full">

  <h1 class="text-2xl font-bold text-indigo-900 mb-2">Poli Icon Test</h1>

  <!-- Material Symbols: outlined (default) -->
  <div class="flex items-center gap-3 p-3 bg-green-50 rounded">
    <poli-icon name="check_circle" class="w-6 h-6 text-green-600" />
    <span>Outlined icon: check_circle</span>
  </div>

  <!-- Material Symbols: filled variant -->
  <div class="flex items-center gap-3 p-3 bg-yellow-50 rounded">
    <poli-icon name="star" fill class="w-6 h-6 text-yellow-500" />
    <span>Filled icon: star</span>
  </div>

  <!-- Material Symbols: different sizes -->
  <div class="flex items-center gap-3 p-3 bg-red-50 rounded">
    <poli-icon name="warning" class="w-4 h-4 text-red-500" />
    <poli-icon name="warning" class="w-6 h-6 text-red-500" />
    <poli-icon name="warning" class="w-8 h-8 text-red-500" />
    <span>Multiple sizes</span>
  </div>

  <!-- Material Symbols: rounded style -->
  <div class="flex items-center gap-3 p-3 bg-blue-50 rounded">
    <poli-icon name="home" style-name="rounded" class="w-6 h-6 text-blue-600" />
    <span>Rounded style: home</span>
  </div>

  <!-- Icons in a @for loop (tests caching) -->
  <div class="p-3 bg-gray-50 rounded">
    <h2 class="font-bold mb-2">Status list (icons in a loop)</h2>
    @for (item of statuses) {
      <div class="flex items-center gap-2 py-1">
        <poli-icon name="{{ item.icon }}" class="w-5 h-5 {{ item.color }}" />
        <span>{{ item.label }}</span>
      </div>
    }
  </div>

  <!-- Custom library icon -->
  <div class="flex items-center gap-3 p-3 bg-purple-50 rounded">
    <poli-icon library="custom" name="stamp" class="w-8 h-8 text-purple-600" />
    <span>Custom library icon: stamp</span>
  </div>

  <!-- Icon with Tailwind color classes -->
  <div class="flex items-center gap-3 p-3 bg-white border rounded">
    <poli-icon name="favorite" fill class="w-6 h-6 text-pink-500" />
    <poli-icon name="favorite" class="w-6 h-6 text-gray-400" />
    <span>Fill="currentColor" test (pink filled, gray outlined)</span>
  </div>

</div>
