<div class="bg-white text-gray-800 text-sm font-sans px-10 pt-8 pb-4 flex flex-col gap-6 w-full">
	<h1 class="text-2xl font-bold text-gray-900">SVG Rendering Test</h1>
	<p class="text-gray-500">
		Inline SVGs should render correctly as vector graphics.
	</p>

	<!-- Simple inline SVG -->
	<div class="flex items-center gap-4">
		<svg viewBox="0 0 48 48" class="w-12 h-12" fill="none">
			<circle cx="24" cy="24" r="22" stroke="#4F46E5" stroke-width="2" />
			<path d="M16 24l6 6 10-12" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
		</svg>
		<span class="text-gray-700">Checkmark icon — circle + path</span>
	</div>

	<!-- SVG with groups and transforms -->
	<div class="flex items-center gap-4">
		<svg viewBox="0 0 48 48" class="w-12 h-12">
			<g transform="translate(4, 4)">
				<rect width="40" height="40" rx="8" fill="#EEF2FF" />
				<g transform="translate(8, 8)">
					<rect width="24" height="4" rx="2" fill="#6366F1" />
					<rect y="8" width="18" height="4" rx="2" fill="#6366F1" opacity="0.6" />
					<rect y="16" width="22" height="4" rx="2" fill="#6366F1" opacity="0.3" />
				</g>
			</g>
		</svg>
		<span class="text-gray-700">Nested groups with transforms</span>
	</div>

	<!-- SVG logo with data binding -->
	<div class="flex items-center gap-4">
		<svg viewBox="0 0 48 48" class="w-12 h-12" fill="none">
			<polygon points="24,4 44,40 4,40" fill="{{ brandColor }}" opacity="0.8" />
			<circle cx="24" cy="30" r="6" fill="white" />
		</svg>
		<span class="text-gray-700">{{ brandName }} — bound color: {{ brandColor }}</span>
	</div>

	<!-- SVG with text element -->
	<div class="flex items-center gap-4">
		<svg viewBox="0 0 120 48" class="h-12">
			<rect width="120" height="48" rx="8" fill="#1E293B" />
			<text x="60" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="bold">{{ brandName }}</text>
		</svg>
		<span class="text-gray-700">SVG text element with bound content</span>
	</div>

	<!-- Multiple SVGs in a grid -->
	<div class="grid grid-cols-4 gap-4">
		@for (icon of icons) {
			<div class="flex flex-col items-center gap-1 p-3 rounded-lg bg-gray-50">
				<svg viewBox="0 0 32 32" class="w-8 h-8" fill="none">
					<circle cx="16" cy="16" r="14" fill="{{ icon.bg }}" />
					<path d="{{ icon.path }}" stroke="white" stroke-width="2" stroke-linecap="round" />
				</svg>
				<span class="text-xs text-gray-600">{{ icon.label }}</span>
			</div>
		}
	</div>
</div>
