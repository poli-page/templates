name: Check templates

# index.json and each template's manifest.json / tailwind-additions.css are
# generated by tools/build-template-manifests.mjs. The editor and the CLI
# import a template from those files, so a template listed without them
# (form-w9 until 0.10.1) shows up in the editor and fails to import.

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - run: npm test
