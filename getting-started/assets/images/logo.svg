<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384">
  <!--
    Poli Page logo — 3x3 grid, scaled 3x from 128px base.
    Cell = 128, gap = 12 (4px * 3), radius = 48 (16px * 3).
  -->

  <!-- Cell [0,0]: L-shape — transparent 12x12 notch at bottom-right -->
  <rect x="0" y="0" width="116" height="128" fill="#414141"/>
  <rect x="116" y="0" width="12" height="116" fill="#414141"/>

  <!-- Cell [0,1]: #414141, mb-1 mr-1 -->
  <rect x="128" y="0" width="116" height="116" fill="#414141"/>

  <!-- Cell [0,2]: #7b7b7b, mb-1 ml-1, rounded-tr-2xl -->
  <path d="M268 0 H336 Q384 0 384 48 V116 H268 Z" fill="#7b7b7b"/>

  <!-- Cell [1,0]: #414141, mb-1 mr-1 -->
  <rect x="0" y="128" width="116" height="116" fill="#414141"/>

  <!-- Cell [1,1]: transparent (no fill) -->

  <!-- Cell [1,2]: #3d6aa8, mt-1 ml-1 -->
  <rect x="268" y="140" width="116" height="116" fill="#3d6aa8"/>

  <!-- Cell [2,0]: #7b7b7b, mt-1 mr-1, rounded-bl-2xl -->
  <path d="M0 268 H116 V384 H48 Q0 384 0 336 Z" fill="#7b7b7b"/>

  <!-- Cell [2,1]: #3d6aa8, ml-1 mt-1 -->
  <rect x="140" y="268" width="116" height="116" fill="#3d6aa8"/>

  <!-- Cell [2,2]: L-shape — transparent 12x12 notch at top-left -->
  <rect x="256" y="268" width="12" height="116" fill="#3d6aa8"/>
  <rect x="268" y="256" width="116" height="128" fill="#3d6aa8"/>
</svg>
